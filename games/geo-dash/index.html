   Every file is tried on each mirror in GD_CDN_BASES (two rounds). A chunk that comes back with the wrong

            var j = await window.gdCdnFetch(DIR + 'index.json', async function (url) {
                var r = await fetch(url, { cache: 'no-store' });
                if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
                var v = await r.json();
                if (!Array.isArray(v) && !(v && Array.isArray(v.levels))) throw new Error('bad levels index ' + url);
                return v;
            });
            (Array.isArray(j) ? j : j.levels).forEach(function (e) {
                if (typeof e === 'string') add(e);
                else if (e && e.file) add(e.file, e);
            });
        } catch (e) { warn('could not load levels index:', e && e.message || e); }
        out.sort(function (a, b) { return a.file.localeCompare(b.file, undefined, { numeric: true, sensitivity: 'base' }); });
        return out;
    }

    /* one file from the CDN (tries every mirror); resolves with its bytes as an ArrayBuffer */
    function getFile(name) {
        return window.gdCdnFetch(DIR + encodeURIComponent(name), async function (url) {
            var r = await fetch(url);
            if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url);
            return await r.arrayBuffer();
        });
    }

    /* returns the new save bytes, or null when there is nothing to add */
    async function apply(bytes) {
        var G = window.GMDSave;
        if (!G) throw new Error('GMDSave is not ready');
        var files = await listFolder();
        if (!files.length) return null;
        var xml = await G.decodeSave(bytes), dirty = false, map = loadMap(), mapDirty = false;
        var have = {}, songs = {};
        (function () { var d = G.scanDict(xml, 'GLM_03'); (d ? d.keys : []).forEach(function (k) { have[k] = 1; }); })();
        G.knownSongs(xml).forEach(function (s) { songs[s.id] = 1; });
        function of(re) { return files.filter(function (f) { return re.test(f.file); }); }

        /* songs first, so the levels that use them find them */
        var mp3 = of(/\.mp3$/i);
        for (var i = 0; i < mp3.length; i++) {
            var name = mp3[i].file;
            try {
                var m = /^(\d+)(?:\D|$)/.exec(name);
                if (!m) continue;
                var sid = parseInt(m[1], 10);
                if (songs[sid] && G.hasAudio(sid + '.mp3')) continue;
                var data = new Uint8Array(await getFile(name));
                await G.storeAudioFile(sid + '.mp3', data);
                var title = name.replace(/\.mp3$/i, '').replace(/^\d+[\s._-]*/, '').trim() || ('Song ' + sid);
                var rs = G.addSong(xml, { id: sid, name: title, bytes: data.length });
                if (!rs.skipped) { xml = rs.xml; dirty = true; }
                songs[sid] = 1;
            } catch (err) { warn(name + ':', err && err.message || err); }
        }

        /* bundles: level + its audio in one file */
        var bundles = of(/\.gdlevel$/i);
        for (var b = 0; b < bundles.length; b++) {
            var bn = bundles[b].file;
            try {
                if (map[bn] && have[map[bn]]) continue;
                var h = G.unpackBundle(await getFile(bn), bn);
                var rb = G.applyBundle(xml, h);
                for (var a = 0; a < rb.audio.length; a++) await G.storeAudioFile(rb.audio[a].name, rb.audio[a].data);
                xml = rb.xml; dirty = true; have[rb.id] = 1;
                map[bn] = rb.id; mapDirty = true;
            } catch (err) { warn(bn + ':', err && err.message || err); }
        }

        /* plain levels */
        var gmds = of(/\.gmd$/i);
        for (var g = 0; g < gmds.length; g++) {
            var gn = gmds[g].file;
            try {
                var id = parseInt(gmds[g].id, 10) || idFor(gn);
                if (have[id]) continue;
                var text = new TextDecoder().decode(await getFile(gn));
                var rl = G.addSavedLevel(xml, text, { id: id, song: parseInt(gmds[g].song, 10) || 0 });
                if (rl.skipped) continue;
                xml = rl.xml; dirty = true; have[id] = 1;
            } catch (err) { warn(gn + ':', err && err.message || err); }
        }
        if (mapDirty) saveMap(map);
        return dirty ? await G.encodeSave(xml) : null;
    }

    function currentBytes() {
        var d = window.__gdUserData && window.__gdUserData[GM];
        if (d && d.length) return d;
        try { return new Uint8Array(Module.FS.readFile('/AppData/' + GM)); } catch (e) {}
        return null;
    }
    function writeSave(bytes, freeze) {
        return window.__gdUser.override([{ name: GM, bytes: bytes }, { name: 'CCGameManager2.dat', bytes: bytes }], freeze ? { freeze: true } : undefined);
    }

    /* very first launch: there is no save to edit yet. Wait for the game to write one,
       add the levels to it, and reload once so the game picks it up. */
    function waitForFirstSave() {
        try { if (sessionStorage.getItem('gdLevelsReload')) return; } catch (e) {}
        var tried = false;
        function onSave(ev) {
            if (tried || !ev.detail || ev.detail.name !== GM) return;
            tried = true;
            window.removeEventListener('gduser-save', onSave);
            (async function () {
                var bytes = currentBytes();
                if (!bytes) return;
                var out = await apply(bytes);
                if (!out) return;
                try { sessionStorage.setItem('gdLevelsReload', '1'); } catch (e) {}
                try { if (window.Module && Module._gd_autosave_set) Module._gd_autosave_set(0); } catch (e) {}
                if (await writeSave(out, true)) location.reload();
            })().catch(function (e) { warn('failed:', e); });
        }
        window.addEventListener('gduser-save', onSave);
        setTimeout(function () { try { if (Module._gd_request_save) Module._gd_request_save(); } catch (e) {} }, 6000);
    }

    async function preBoot() {
        var G = window.GMDSave;
        if (!G || !window.__gdUser || !window.__gdUser.override) return;
        var bytes = currentBytes();
        if (!bytes) { waitForFirstSave(); return; }
        var out = await apply(bytes);
        if (!out || abandoned) return;      /* too slow: the game already started, retry next load */
        await writeSave(out, false);
    }

    var origInit = window.__gdUserInit;
    if (typeof origInit === 'function') {
        window.__gdUserInit = function (cands, done) {
            origInit.call(this, cands, function () {
                var fin = false;
                function go() { if (fin) return; fin = true; done(); }
                var to = setTimeout(function () { abandoned = true; go(); }, MAXWAIT);
                preBoot().then(function () { clearTimeout(to); go(); },
                    function (e) { warn('failed:', e); clearTimeout(to); go(); });
            });
        };
    }
})();
</script>
<script>
/* Save layer: mirrors the guest's virtual filesystem into IndexedDB so saves
   survive refresh, and asks the guest to save regularly.
   ?saveEvery=SECONDS tunes the guest save request interval (default 30, 0 = off). */
(function () {
    var DB = 'gdwasm_saves', ST = 'files', PFX = 'fs:', MAXB = 64 * 1048576;
    var db = null, last = {}, base = {}, mirrored = {}, restored = {}, started = false, soonT = null, t0 = 0;
    var every = 30;
    function log() { try { console.log.apply(console, ['[save]'].concat([].slice.call(arguments))); } catch (e) {} }
    function open() {
        try {
            var r = indexedDB.open(DB, 1);
            r.onupgradeneeded = function () {
                if (!r.result.objectStoreNames.contains(ST)) r.result.createObjectStore(ST);
            };
            r.onsuccess = function () {
                db = r.result;
                db.onversionchange = function () { try { db.close(); } catch (e) {} db = null; };
                db.onclose = function () { db = null; };
            };
            r.onerror = function () { log('IndexedDB open failed'); };
        } catch (e) { log('IndexedDB unavailable', e); }
    }
    open(); /* keep a connection open early: it must exist before unload */
    try {
        if (navigator.storage && navigator.storage.persist)
            navigator.storage.persist().then(function (g) { log('persistent storage:', g); });
    } catch (e) {}
    function ready() { return window.__gdRuntimeReady && window.Module && Module.FS; }
    function sig(st) { return st.size + ':' + (+st.mtime); }
    function scan(dir, recurse, out) {
        var FS = Module.FS, names;
        try { names = FS.readdir(dir); } catch (e) { return; }
        names.forEach(function (n) {
            if (n === '.' || n === '..') return;
            var p = dir + '/' + n, st;
            try { st = FS.stat(p); } catch (e) { return; }
            if (FS.isDir(st.mode)) { if (recurse) scan(p, true, out); }
            else if (FS.isFile(st.mode)) out[p] = st;
        });
    }
    function sync(why) {
        if (!started || !ready()) return;
        if (!db) { open(); return; }
        var cur = {}, res = {}, puts = [], p;
        scan('/Resources', false, res); /* new/changed top-level files only */
        /* The game reads saves from /AppData, but writes some of them (e.g.
           CCGameManager.dat) into /Resources. Mirror those into /AppData so
           they are found on the next load and stored under the /AppData key. */
        for (p in res) {
            var mm = p.match(/^\/Resources\/([^\/]+\.dat)$/);
            if (!mm || base[p] === sig(res[p]) || mirrored[p] === sig(res[p])) continue;
            try {
                try { Module.FS.stat('/AppData'); } catch (e) { Module.FS.mkdir('/AppData'); }
                Module.FS.writeFile('/AppData/' + mm[1], Module.FS.readFile(p));
                mirrored[p] = sig(res[p]);
                log('mirrored', p, '-> /AppData/' + mm[1]);
            } catch (e) { log('mirror failed', p, e); }
        }
        scan('/AppData', true, cur);
        for (p in res) {
            if (/^\/Resources\/[^\/]+\.dat$/.test(p)) continue; /* stored via /AppData copy */
            if (base[p] !== sig(res[p])) cur[p] = res[p];
        }
        for (p in cur) if (last[p] !== sig(cur[p]) && cur[p].size <= MAXB) puts.push(p);
        if (!puts.length) return;
        try {
            var tx = db.transaction(ST, 'readwrite'), os = tx.objectStore(ST);
            puts.forEach(function (p) {
                var data = Module.FS.readFile(p), key = PFX + p;
                var r = restored[p];
                if (r && !r.warned && Date.now() - r.t < 120000) {
                    r.warned = true;
                    console.warn('[save] the game rewrote restored file ' + p + ' ' +
                        Math.round((Date.now() - r.t) / 1000) + 's after restore: ' +
                        r.size + ' -> ' + data.byteLength + ' bytes');
                }
                /* keep the previous copy if a file suddenly shrinks a lot
                   (e.g. defaults overwriting a real save) */
                var g = os.get(key);
                os.put(data, key);
                g.onsuccess = function () {
                    var old = g.result;
                    if (old && old.byteLength > 2000 && data.byteLength < old.byteLength * 0.5) {
                        os.put(old, 'bak:' + p);
                        console.warn('[save] ' + p + ' shrank ' + old.byteLength + ' -> ' +
                            data.byteLength + ' bytes; previous copy kept as backup');
                    }
                };
                last[p] = sig(cur[p]);
            });
            tx.onabort = tx.onerror = function () {
                puts.forEach(function (p) { delete last[p]; });
                log('write failed, will retry');
            };
            log('saved', puts.join(', '), why || '');
        } catch (e) {
            puts.forEach(function (p) { delete last[p]; });
            log('sync failed', e);
        }
    }
    function requestGuestSave() {
        try { if (Module._gd_request_save) Module._gd_request_save(); } catch (e) {}
        setTimeout(function () { sync('after guest save'); }, 1500);
        setTimeout(function () { sync('after guest save'); }, 5000);
    }
    window.__gdSave = {
        sync: sync,
        mark: function (p) { try { var st = Module.FS.stat(p); last[p] = sig(st); restored[p] = { size: st.size, t: Date.now() }; } catch (e) {} },
        soon: function () {
            if (soonT) return;
            soonT = setTimeout(function () { soonT = null; sync('guest write'); }, 400);
        },
        start: function () {
            if (started) return;
            try { var b = {}; scan('/Resources', false, b); for (var p in b) base[p] = sig(b[p]); } catch (e) {}
            started = true;
            setInterval(function () { sync('interval'); }, 3000);
            if (every > 0) setInterval(function () {
                if (!document.hidden && window.__gdInputReady === true) requestGuestSave();
            }, every * 1000);
            log('save layer started; guest save every', every, 's');
        },
        saveNow: requestGuestSave,
    };
    function flush(why) { sync(why); }
    window.addEventListener('pagehide', function () { flush('pagehide'); });
    window.addEventListener('beforeunload', function () { flush('beforeunload'); });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            flush('hidden');
            setTimeout(function () { sync('hidden+1s'); }, 1000);
            setTimeout(function () { sync('hidden+3s'); }, 3000);
        }
    });
})();
</script>
